<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 740" width="420" height="740">
  <style>
    .bg { fill: #eef2f7; }
    .card { fill: #ffffff; stroke: #333; stroke-width: 3; rx: 24; }
    .button { fill: #3b4cca; rx: 12; }
    .button-text { fill: white; font: bold 18px Arial; text-anchor: middle; }
    .text { fill: #333; font: 16px Arial; }
    .panel { fill: #f0f4ff; stroke: #3b4cca; stroke-dasharray: 6 4; }
  </style>
  <rect width="420" height="740" class="bg" />
  <rect x="20" y="20" width="380" height="700" class="card" />
  <text x="210" y="80" class="text" font-size="28" font-weight="bold">Guess That Pokémon</text>
  <rect x="40" y="120" width="340" height="120" class="panel" rx="16" />
  <text x="60" y="160" class="text">Select a mode:</text>
  <rect x="60" y="190" width="300" height="48" class="button" />
  <text x="210" y="223" class="button-text">Singleplayer</text>
  <rect x="60" y="252" width="300" height="48" class="button" />
  <text x="210" y="285" class="button-text">Multiplayer</text>
  <rect x="40" y="340" width="340" height="180" class="panel" rx="16" />
  <text x="60" y="380" class="text">Multiplayer room controls</text>
  <text x="60" y="410" class="text">• Host / join room</text>
  <text x="60" y="440" class="text">• Invite link</text>
</svg>
