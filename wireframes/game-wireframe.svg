<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 740" width="420" height="740">
  <style>
    .bg { fill: #eef2f7; }
    .card { fill: #ffffff; stroke: #333; stroke-width: 3; rx: 24; }
    .banner { fill: #ff3334; rx: 14; }
    .panel { fill: #f9f9f9; stroke: #ccc; rx: 16; }
    .button { fill: #3b4cca; rx: 12; }
    .button-secondary { fill: #2e7d32; rx: 12; }
    .text { fill: #333; font: 16px Arial; }
    .small { font-size: 14px; }
  </style>
  <rect width="420" height="740" class="bg" />
  <rect x="20" y="20" width="380" height="700" class="card" />
  <rect x="40" y="40" width="340" height="44" class="banner" />
  <text x="210" y="70" class="text" fill="white" font-weight="bold">Player Turn</text>
  <rect x="40" y="100" width="340" height="240" class="panel" />
  <text x="60" y="140" class="text">Silhouette image</text>
  <rect x="70" y="160" width="280" height="140" fill="#ddd" rx="16" />
  <rect x="40" y="360" width="340" height="180" class="panel" />
  <text x="60" y="400" class="text">Answer options</text>
  <rect x="60" y="420" width="300" height="38" fill="#fff" stroke="#ccc" rx="10" />
  <rect x="60" y="470" width="300" height="38" fill="#fff" stroke="#ccc" rx="10" />
  <rect x="60" y="520" width="300" height="38" fill="#fff" stroke="#ccc" rx="10" />
  <rect x="60" y="570" width="300" height="38" fill="#fff" stroke="#ccc" rx="10" />
  <rect x="60" y="630" width="140" height="42" class="button-secondary" />
  <text x="130" y="657" class="button-text">Hint</text>
  <rect x="220" y="630" width="140" height="42" class="button" />
  <text x="290" y="657" class="button-text">Submit</text>
</svg>
